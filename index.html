<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Restaurant</title>
<link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
@font-face { font-family: 'NH'; src: url('nh.otf') format('opentype'); }
@font-face { font-family: 'DSD'; src: url('dsdigi.TTF') format('truetype'), url('dsdigi.ttf') format('truetype'); }

:root {
  --wall: #6eb5d0;
  --accent: #4a9bb5;
  --panel: #fff7e3;
  --ink: #2b2a27;
  --plastic: #efe7d6;
  --plastic-dark: #d9cfb9;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  font-family: 'M PLUS Rounded 1c', 'NH', sans-serif;
  color: var(--ink);
  background: #2b2118;
  -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none;
}
button { font-family: inherit; color: inherit; }
img { -webkit-user-drag: none; user-select: none; }
.nh { font-family: 'NH', 'M PLUS Rounded 1c', sans-serif; font-weight: 500; }

/* ================= RESTAURANT SELECTION ================= */
#picker {
  position: fixed; inset: 0; overflow: auto;
  background-color: #f4c95d;
  background-image:
    linear-gradient(rgba(255,255,255,.22) 2px, transparent 2px),
    linear-gradient(90deg, rgba(255,255,255,.22) 2px, transparent 2px);
  background-size: 48px 24px;
  display: flex; flex-direction: column; align-items: center; padding: 48px 24px 64px;
}
#picker h1 { font-family: 'NH', sans-serif; font-weight: 500; font-size: clamp(36px, 5vw, 64px); line-height: 1.3; margin: 0 0 36px; color: #3b2a12; }
.street { display: flex; flex-wrap: wrap; gap: 36px; justify-content: center; max-width: 1400px; }
.storefront {
  appearance: none; border: 0; padding: 0; cursor: pointer; width: 280px; background: none;
  display: flex; flex-direction: column; align-items: stretch; transition: transform .12s;
}
.storefront:hover { transform: translateY(-4px); }
.storefront:active { transform: translateY(2px) scale(.98); }
.awning {
  height: 56px; border-radius: 14px 14px 0 0; position: relative; z-index: 1;
  background: repeating-linear-gradient(90deg, var(--c1) 0 35px, #fffaf0 35px 70px);
  filter: drop-shadow(3px 0 0 #3b2a12) drop-shadow(-3px 0 0 #3b2a12) drop-shadow(0 -3px 0 #3b2a12) drop-shadow(0 3px 0 #3b2a12) drop-shadow(0 5px 0 rgba(0,0,0,.18));
}
.awning::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: -14px; height: 14px;
  background: radial-gradient(circle at 17.5px 0, var(--c1) 17px, transparent 18px) 0 0 / 70px 14px repeat-x,
              radial-gradient(circle at 52.5px 0, #fffaf0 17px, transparent 18px) 0 0 / 70px 14px repeat-x;
}
.shopfront {
  background: #fffaf0; border: 6px solid var(--c2); border-top: 0; border-radius: 0 0 18px 18px;
  padding: 32px 18px 22px; display: flex; flex-direction: column; align-items: center; gap: 10px;
  box-shadow: 0 0 0 3px #3b2a12, 0 13px 0 rgba(0,0,0,.18), 0 20px 30px rgba(0,0,0,.18);
}
.shopfront img { width: 130px; height: 130px; object-fit: cover; border-radius: 20px; background: #fff; box-shadow: 0 3px 0 rgba(0,0,0,.12); }
.shopfront .emoji { font-size: 90px; line-height: 130px; }
.shopfront h2 { font-family: 'NH', sans-serif; font-weight: 500; font-size: 28px; margin: 4px 0 0; text-align: center; line-height: 1.25; }
.shopfront p { margin: 0; font-size: 14px; font-weight: 800; color: #6e5e3e; text-align: center; }

/* ================= STAGE ================= */
#app { position: fixed; inset: 0; display: none; background: var(--wall); }
#app.on { display: block; }
#stage {
  position: absolute; left: 0; top: 0; width: 1560px; height: 700px;
  transform-origin: 0 0; overflow: hidden; --dx: 0px; --dy: 0px; --cols: 3;
}
.abs { position: absolute; }

/* wall + counter */
#wall {
  left: 0; top: 0; width: 100%; height: calc(580px + var(--dy));
  background-color: var(--wall); background-size: cover; background-position: center top; background-repeat: no-repeat;
}
#wall::after { /* soft shade where wall meets counter */
  content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 60px;
  background: linear-gradient(transparent, rgba(0,0,0,.16));
}
#countertop {
  left: 0; top: calc(570px + var(--dy)); width: 100%; height: 130px;
  background-color: var(--ctr);
  background-image: linear-gradient(rgba(255,255,255,.28), rgba(255,255,255,0) 22px), repeating-linear-gradient(90deg, rgba(255,255,255,.07) 0 3px, transparent 3px 17px, rgba(60,30,0,.08) 17px 19px, transparent 19px 41px);
  box-shadow: inset 0 5px 0 rgba(255,255,255,.5), 0 -4px 0 rgba(40,20,0,.28), 0 -10px 14px rgba(0,0,0,.18);
}
#counterfront {
  left: 0; top: calc(690px + var(--dy)); width: 100%; height: 60px;
  background-color: var(--ctr-d); box-shadow: inset 0 5px 0 rgba(255,255,255,.3);
}
.floorshadow { border-radius: 50%; background: radial-gradient(closest-side, rgba(40,20,0,.45), rgba(40,20,0,0)); }

/* wall buttons */
.wallbtn {
  appearance: none; border: 0; cursor: pointer; height: 40px; padding: 0 15px; border-radius: 999px;
  background: #fffdf6; color: #3b2a12; font-weight: 800; font-size: 15px;
  display: inline-flex; align-items: center; gap: 6px;
  box-shadow: 0 4px 0 rgba(0,0,0,.25);
}
.wallbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.25); }
.wallbtn.icon { width: 40px; padding: 0; justify-content: center; }

/* hanging sign */
#sign {
  left: 50%; transform: translateX(-50%); top: 20px; width: 560px; height: 66px;
  background: #fff8e7; border: 5px solid var(--accent); border-radius: 18px;
  display: flex; align-items: center; justify-content: center; gap: 12px; padding: 0 14px;
  box-shadow: 0 8px 0 rgba(0,0,0,.14), 0 14px 22px rgba(0,0,0,.15);
}
#sign::before, #sign::after {
  content: ''; position: absolute; top: -18px; width: 4px; height: 14px; background: #6b5a44; border-radius: 2px;
}
#sign::before { left: 90px; } #sign::after { right: 90px; }
#signLogo { width: 46px; height: 46px; border-radius: 14px; object-fit: cover; flex-shrink: 0; }
#signName {
  font-family: 'NH', sans-serif; font-size: 36px; line-height: 1.3; padding-bottom: .1em; color: #3b2a12; outline: none;
  white-space: nowrap; max-width: 420px;
}

/* speech */
#talk { left: calc(596px + var(--dx)); top: calc(92px + var(--dy)); width: 940px; height: 64px; display: flex; justify-content: space-between; align-items: center; gap: 14px; pointer-events: none; }
.tb { display: flex; align-items: center; gap: 12px; min-width: 0; pointer-events: auto; }
.tav { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; background: #fff; border: 4px solid #fff; box-shadow: 0 4px 0 rgba(0,0,0,.25); flex-shrink: 0; }
.tbub {
  appearance: none; border: 0; cursor: pointer; position: relative; display: flex; align-items: center; gap: 10px;
  background: #fff; color: #2b2a27; border-radius: 20px; padding: 6px 16px 10px;
  font-family: 'NH', sans-serif; font-size: 27px; line-height: 1.3; white-space: nowrap;
  box-shadow: 0 4px 0 rgba(0,0,0,.2); animation: pop .3s ease both;
}
.tbub.long { font-size: 22px; }
.tbub::after { content: ''; position: absolute; top: 50%; margin-top: -9px; border: 9px solid transparent; }
.tb.cash .tbub::after { left: -16px; border-right-color: #fff; border-left: 0; }
.tb.cust .tbub::after { right: -16px; border-left-color: #fff7d1; border-right: 0; }
.tb.cust .tbub { background: #fff7d1; animation-delay: .9s; }
#talk.cfirst .tb.cust .tbub { animation-delay: 0s; }
#talk.cfirst .tb.cash .tbub { animation-delay: .9s; }
.tbub:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.2); }
.hear { opacity: .35; display: grid; place-items: center; }
.tbub:hover .hear { opacity: .8; }
.tbub .blank { display: inline-block; min-width: 84px; height: .75em; border-bottom: 5px dashed #c9b88a; margin: 0 .1em; }

/* ================= MENU STAND ================= */
#menuStand { left: 30px; top: 100px; width: calc(530px + var(--dx)); height: calc(540px + var(--dy)); }
#rg { position: absolute; left: var(--dx); top: var(--dy); width: 1560px; height: 700px; pointer-events: none; }
#rg .hit { pointer-events: auto; }
.board {
  position: absolute; inset: 0; border-radius: 20px; background: var(--accent);
  box-shadow: inset 0 3px 0 rgba(255,255,255,.35), inset 0 -5px 0 rgba(0,0,0,.2), 0 12px 0 rgba(0,0,0,.12);
  padding: 11px;
}
.board-inner {
  width: 100%; height: 100%; border-radius: 12px; background: var(--panel);
  box-shadow: inset 0 3px 8px rgba(0,0,0,.18);
  padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 8px; overflow: hidden;
}
.clip { left: 200px; top: -14px; width: 90px; height: 28px; border-radius: 10px 10px 6px 6px; background: #b9bec6; box-shadow: inset 0 3px 0 #e3e6ea, inset 0 -4px 0 #8e949c, 0 3px 4px rgba(0,0,0,.25); z-index: 2; }
.clip::after { content: ''; position: absolute; left: 38px; top: 8px; width: 24px; height: 10px; border-radius: 5px; background: #7d838b; }
.foot { position: absolute; bottom: -16px; width: 46px; height: 20px; background: #5a3a1c; border-radius: 0 0 8px 8px; }
.stshadow { position: absolute; left: -10px; right: -10px; bottom: -34px; height: 40px; border-radius: 50%; background: radial-gradient(closest-side, rgba(40,20,0,.45), rgba(40,20,0,0)); }
.menuhead { display: flex; align-items: center; gap: 10px; height: 44px; flex-shrink: 0; }
.menuhead img { width: 44px; height: 44px; border-radius: 12px; object-fit: cover; }
.menuhead h2 { margin: 0; font-family: 'NH', sans-serif; font-weight: 500; font-size: 34px; line-height: 1.25; }
.tabs { display: flex; gap: 8px; flex-shrink: 0; }
.tab {
  appearance: none; border: 0; cursor: pointer; flex: 1; height: 38px; border-radius: 10px 10px 5px 5px;
  background: #f1e6cb; color: #6e5e3e; font-weight: 800; font-size: 15px;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  box-shadow: 0 4px 0 #dccb9f;
}
.tab.now { background: #2f6fdb; color: #fff; box-shadow: 0 4px 0 #1f4e9e; }
.tab.done { background: #ddefd9; color: #1e6b3a; box-shadow: 0 4px 0 #b7d8af; }
.tab.active { outline: 3px solid #2b2a27; outline-offset: 2px; }
.tab:disabled { cursor: default; opacity: .5; }
.tab.done:disabled { opacity: 1; }
.tab:not(:disabled):active { transform: translateY(3px); box-shadow: none; }
#grid {
  flex-grow: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
  display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); gap: 12px; align-content: start;
  padding: 4px 6px 10px 2px; scrollbar-width: thin; scrollbar-color: var(--accent) transparent;
}
#grid::-webkit-scrollbar { width: 10px; }
#grid::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 6px; }
.card {
  appearance: none; border: 0; cursor: pointer; background: #fff; border-radius: 16px;
  aspect-ratio: 4 / 5; container-type: inline-size;
  box-shadow: 0 5px 0 rgba(0,0,0,.12), 0 7px 12px rgba(80,50,0,.1);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.5cqw; padding: 6px 4px;
  transition: transform .08s, box-shadow .08s;
}
.card:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,.12); }
.card img.pic { width: 64%; aspect-ratio: 1; height: auto; object-fit: contain; }
.card .sets { display: flex; gap: 2cqw; }
.card .sets img { width: 28cqw; height: 28cqw; object-fit: contain; }
.card .nm { font-family: 'NH', sans-serif; font-size: 19px; font-size: clamp(15px, 12.5cqw, 36px); line-height: 1.3; text-align: center; padding-bottom: .12em; overflow-wrap: anywhere; }
.card .nm.l1 { font-size: 16px; font-size: clamp(13px, 10.5cqw, 30px); }
.card .nm.l2 { font-size: 14px; font-size: clamp(12px, 9cqw, 26px); }
.card .pr { font-weight: 800; font-size: 18px; font-size: clamp(15px, 12cqw, 34px); color: #b42318; line-height: 1.2; }
.card.newset .pic { opacity: .7; }
.done-panel { grid-column: 1 / -1; padding-top: 70px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; animation: pop .35s ease both; }
.done-panel .tick { width: 100px; height: 100px; border-radius: 50%; background: #ddefd9; color: #1e6b3a; display: grid; place-items: center; }
.done-panel .big { font-family: 'NH', sans-serif; font-size: 42px; line-height: 1.25; }
.done-panel .small { font-size: 18px; font-weight: 800; color: #6e5e3e; }
.empty-note { grid-column: 1 / -1; text-align: center; font-weight: 800; color: #6e5e3e; padding: 40px 0; }

/* flying food */
.fly { position: absolute; z-index: 50; pointer-events: none; transition: transform .55s cubic-bezier(.5,-0.2,.6,1), opacity .55s ease-in; }

/* ================= REGISTER ================= */
#regBody {
  left: 630px; top: 168px; width: 500px; height: 322px; border-radius: 32px 32px 8px 8px; z-index: 4;
  background: linear-gradient(#fcf6e8, #efe5cf 45%, #e2d5b6);
  box-shadow: inset 0 3px 0 #fffdf6, inset 0 -6px 0 #cdbf9f, inset 5px 0 0 #f8f1df, inset -5px 0 0 #d6c8a8, 0 0 0 3px rgba(40,25,10,.6), 0 10px 18px rgba(40,20,0,.3);
}
.bezel { left: 60px; top: 10px; width: 380px; height: 64px; border-radius: 14px; background: #23262b; padding: 6px; box-shadow: inset 0 2px 0 #4a4e55, 0 0 0 3px #b9ae95, 0 5px 0 3px #8f856f; }
.rled { left: 22px; top: 14px; }
.rled i { display: block; width: 11px; height: 11px; border-radius: 50%; margin-bottom: 9px; box-shadow: 0 0 7px 1px currentColor, inset 0 -2px 0 rgba(0,0,0,.25); color: #fff; opacity: .9; }
.grille { right: 20px; top: 16px; width: 30px; }
.grille i { display: block; height: 5px; border-radius: 3px; background: #b6aa8f; margin-bottom: 6px; box-shadow: inset 0 2px 0 rgba(0,0,0,.3), 0 1px 0 #fffdf6; }
#vfd {
  width: 100%; height: 100%; border-radius: 8px; background: #06140f; position: relative; overflow: hidden;
  padding: 2px 12px; font-family: 'DSD', monospace; color: #6bffc1;
  text-shadow: 0 0 6px rgba(107,255,193,.75), 0 0 16px rgba(107,255,193,.35);
  box-shadow: inset 0 0 18px rgba(0,0,0,.9);
}
#vfd::after { content: ''; position: absolute; inset: 0; background: linear-gradient(115deg, rgba(255,255,255,.1) 0 30%, transparent 30%); pointer-events: none; }
#vfd.err { color: #ff8a7a; text-shadow: 0 0 6px rgba(255,138,122,.85); animation: shake .45s; }
.vrow { display: flex; justify-content: space-between; align-items: baseline; white-space: nowrap; }
#v1, #v1r { font-size: 16px; line-height: 18px; letter-spacing: .05em; }
#v1.long { font-size: 13px; }
#v2label { font-size: 13px; letter-spacing: .1em; }
#v2 { font-size: 34px; line-height: 30px; letter-spacing: .03em; }
.ghost { position: absolute; right: 12px; bottom: 3px; font-size: 34px; line-height: 30px; letter-spacing: .03em; opacity: .05; }
#hintPlate {
  left: 38px; top: 82px; width: 424px; height: 26px; border-radius: 8px;
  background: #fffdf4; border: 2px solid #cfc2a2; color: #3b3326;
  font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 8px;
}
#hintPlate .pill { flex-shrink: 0; background: #2f6fdb; color: #fff; border-radius: 999px; font-size: 11px; letter-spacing: .1em; padding: 0 10px; line-height: 14px; }
#hint { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.deck {
  left: 12px; top: 114px; width: 476px; height: 198px; border-radius: 18px;
  background: linear-gradient(var(--acc-l), var(--acc) 30%, var(--acc-d));
  box-shadow: inset 0 3px 0 rgba(255,255,255,.5), inset 0 -5px 0 rgba(0,0,0,.28), 0 0 0 3px rgba(40,25,10,.55);
}
.deck::before { content: ''; position: absolute; left: 8px; right: 8px; top: 8px; bottom: 9px; border-radius: 11px; background: rgba(0,0,0,.2); box-shadow: inset 0 3px 6px rgba(0,0,0,.35); }
#keys {
  left: 24px; top: 124px; width: 452px; height: 178px;
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr)); gap: 8px;
  transform: perspective(620px) rotateX(9deg); transform-origin: 50% 100%;
}
.key {
  --cap: #fbf8f1; --edge: #bdb199; --txt: #2b2a27;
  appearance: none; border: 0; cursor: pointer; border-radius: 10px; background: linear-gradient(rgba(255,255,255,.55), rgba(255,255,255,0) 55%), var(--cap); color: var(--txt);
  font-weight: 800; font-size: 20px; line-height: 1;
  box-shadow: 0 5px 0 var(--edge), 0 7px 8px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.7);
  transition: transform .05s, box-shadow .05s;
}
.key.locked { opacity: .45; filter: saturate(.5); }
.key:active, .key.down { transform: translateY(4px); box-shadow: 0 1px 0 var(--edge), 0 2px 4px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.4); }
.k-clear { --cap: #e0464b; --edge: #9e2226; --txt: #fff; font-size: 14px; }
.k-void  { --cap: #f7a13e; --edge: #b86a14; --txt: #3a1e00; font-size: 14px; }
.k-total { --cap: #2f6fdb; --edge: #1f4e9e; --txt: #fff; font-size: 18px; }
.k-cash  { --cap: #1a9a55; --edge: #0e5e33; --txt: #fff; font-size: 18px; }
.key .small { display: block; font-size: 9px; letter-spacing: .14em; opacity: .85; margin-bottom: 1px; }
.k-cash .small { display: none; }
.k-bill  { --cap: #cfdcf3; --edge: #8ea6cf; --txt: #1e3a6e; font-size: 16px; }
.glow { animation: glow 1.1s ease-in-out infinite; }
@keyframes glow { 0%,100% { box-shadow: 0 5px 0 var(--edge), 0 2px 0 0 rgba(255,194,26,0); } 50% { box-shadow: 0 5px 0 var(--edge), 0 2px 0 6px rgba(255,194,26,.95); } }
#bell { left: 1164px; top: 538px; width: 56px; height: 46px; padding: 0; border: 0; background: none; cursor: pointer; z-index: 5; transform-origin: 50% 90%; filter: drop-shadow(0 3px 0 rgba(0,0,0,.25)); }
#bell:active { transform: scale(.94); }

/* base + drawer */
#regBase {
  left: 600px; top: 484px; width: 560px; height: 130px; border-radius: 8px 8px 16px 16px; z-index: 2;
  background: linear-gradient(var(--acc), var(--acc-d));
  box-shadow: inset 0 4px 0 rgba(255,255,255,.35), inset 0 -6px 0 rgba(0,0,0,.25), 0 0 0 3px rgba(40,25,10,.6), 0 12px 16px rgba(50,25,0,.3);
}
#regBase .recess { position: absolute; left: 16px; top: 8px; right: 16px; bottom: 12px; border-radius: 6px; background: #241f1a; }
#drawerClip { left: 620px; top: 490px; width: 520px; height: 210px; overflow: hidden; z-index: 3; }
#drawer { position: absolute; left: 0; top: -100px; width: 520px; height: 200px; transform: translateY(0); transition: transform .22s ease-in; }
#drawer.open { transform: translateY(100px); transition: transform .55s cubic-bezier(.22,1.45,.42,1); }
.tray {
  height: 100px; background: #3a332c; padding: 5px; display: flex; flex-direction: column; gap: 5px;
  border-left: 5px solid #cfc3a8; border-right: 5px solid #cfc3a8;
}
.trow { flex: 1; display: grid; gap: 5px; }
.trow.bills { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.trow.coins { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.comp { appearance: none; border: 0; padding: 0; font: inherit; position: relative; background: #26221e; border-radius: 6px; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 3px 6px rgba(0,0,0,.55); cursor: default; }
.comp.live { cursor: pointer; }
.comp.live:not(.target) { opacity: .4; }
.comp.target { animation: tgt 0.9s ease-in-out infinite; z-index: 1; outline: 3px solid #ffc21a; outline-offset: -3px; background: #4a4032; }
@keyframes tgt { 0%,100% { box-shadow: inset 0 3px 6px rgba(0,0,0,.55), 0 0 0 0 rgba(255,194,26,0); } 50% { box-shadow: inset 0 0 0 4px #ffc21a, 0 0 14px 3px rgba(255,194,26,.9); } }
.comp.live:hover { background: #3a342d; }
.comp.live:active .coin, .comp.live:active .note { transform: translateY(3px) scale(.94); }
.comp.nope { animation: shake .4s; }
.stack { position: relative; display: grid; place-items: center; pointer-events: none; }
.note { width: 104px; height: 28px; border-radius: 4px; display: grid; place-items: center; font-weight: 800; font-size: 14px; }
.note.n1000 { background: #c9d8f0; color: #1e3a6e; box-shadow: 0 -3px 0 #afc2e2, 0 -6px 0 #93a9d2; }
.note.n5000 { background: #dccdeb; color: #46286b; box-shadow: 0 -3px 0 #cbb6e0, 0 -6px 0 #b49acf; }
.note.n10000 { background: #e8d9be; color: #5a3f12; box-shadow: 0 -3px 0 #dcc8a4, 0 -6px 0 #cbb083; }

.mpaper {

}
.mp-head { display: flex; align-items: center; justify-content: center; gap: 18px; padding: 8px 0 14px; }

.mp-say b { font-family: 'NH', sans-serif; font-weight: 500; font-size: 24px; color: var(--s); }
.mp-sec { margin-top: 18px; }
.mp-rib { position: relative; width: max-content; max-width: 100%; margin: 0 auto 16px; padding: 4px 34px 8px; font-family: 'NH', sans-serif; font-weight: 500; font-size: 34px; line-height: 1.3;
  background: var(--s); color: #fff; border-radius: 14px; box-shadow: 0 5px 0 rgba(0,0,0,.2); display: flex; gap: 12px; align-items: center; }
.mp-rib span { font-size: 30px; }
.mp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 18px; }
.mp-item { background: #fff; border: 4px dashed var(--s); border-radius: 22px; padding: 10px 10px 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; box-shadow: 0 5px 0 rgba(0,0,0,.12); break-inside: avoid; }

.mp-sets img { width: 32%; object-fit: contain; }
.mp-name { font-family: 'NH', sans-serif; font-size: 22px; line-height: 1.3; padding-bottom: .1em; text-align: center; overflow-wrap: anywhere; }
.mp-name.sm { font-size: 17px; }
.mp-price { background: var(--s); color: #fff; font-weight: 800; font-size: 22px; line-height: 1.2; padding: 3px 18px 5px; border-radius: 999px; box-shadow: 0 3px 0 rgba(0,0,0,.2); }

@media print {
  @page { size: A4; margin: 7mm; }
  html, body { background: #fff !important; overflow: visible !important; height: auto !important; }
  body > *:not(#menuModal) { display: none !important; }
  #menuModal { position: static !important; display: block !important; background: none !important; padding: 0 !important; }
  .menuwrap { width: auto !important; max-height: none !important; animation: none !important; }
  .noprint { display: none !important; }
  .mpaper { overflow: visible !important; box-shadow: none !important; border-radius: 12px; padding: 12px 14px; border-width: 6px;
    -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .mpaper * { -webkit-print-color-adjust: exact; print-color-adjust: exact; animation: none !important; }
  .mp-grid { grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .mp-item { box-shadow: none; padding: 6px 6px 8px; border-width: 3px; }

  .mp-ttl h1 { font-size: 40px; } .mp-logo { width: 70px; height: 70px; } .mp-d { font-size: 38px; }
  .mp-rib { font-size: 26px; margin-bottom: 10px; break-after: avoid; } .mp-sec { margin-top: 12px; }
  .mp-name { font-size: 16px; } .mp-name.sm { font-size: 13px; } .mp-price { font-size: 16px; }
}

.wallbtn.off { opacity: .6; }
@keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }

@keyframes wiggle { 0%, 70%, 100% { transform: rotate(0); } 78% { transform: rotate(-2.5deg); } 86% { transform: rotate(2deg); } 93% { transform: rotate(-1deg); } }

    <button id="bell" class="abs hit" onclick="ringBell()" aria-label="Ring the bell"><svg viewBox="0 0 64 52" width="56" height="46"><ellipse cx="32" cy="46" rx="28" ry="5" fill="#8a6a1c"/><path d="M8 44c0-18 10-30 24-30s24 12 24 30z" fill="#f0c44a"/><path d="M14 40c1-13 8-22 18-24-9 4-13 12-13 24z" fill="#fff3b8" opacity=".8"/><rect x="29" y="6" width="6" height="8" rx="3" fill="#b8901f"/><circle cx="32" cy="6" r="4" fill="#d9a92b"/></svg></button>

        Tear it off!
      </div>
    </div>
    </div><!-- /rg -->

  </div>
</div>

<!-- ============ MODALS ============ -->
<div class="modal" id="menuModal" onclick="if (event.target === this) closeModal('menuModal')">
  <div class="menuwrap">
    <div class="menubar noprint">

      <button class="xbtn" onclick="closeModal('menuModal')" aria-label="Close menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>

<script>
/* ===================== DATA ===================== */
const restaurantKeys = ['horizon', 'kirbycafe', 'pokemon', 'Rilakkuma'];
const restaurants = {};
const CATS = ['main', 'dessert', 'drink'];
const CAT_LABEL = { set: 'Sets', main: 'Main', dessert: 'Dessert', drink: 'Drink' };
const DEN = [
  { v: 10000, kind: 'bill', label: '¥10,000', cls: 'n10000' },
  { v: 5000, kind: 'bill', label: '¥5,000', cls: 'n5000' },
  { v: 1000, kind: 'bill', label: '¥1,000', cls: 'n1000' },
  { v: 500, kind: 'coin', label: '500', cls: 'c500' },
  { v: 100, kind: 'coin', label: '100', cls: 'c100' },
  { v: 50, kind: 'coin', label: '50', cls: 'c50 holed' },
  { v: 10, kind: 'coin', label: '10', cls: 'c10' },
  { v: 5, kind: 'coin', label: '5', cls: 'c5 holed' },
  { v: 1, kind: 'coin', label: '1', cls: 'c1' }
];

async function loadRestaurants() {
  const list = await Promise.all(restaurantKeys.map(async (key) => {
    try {
      const data = await (await fetch(`restaurants/${key}/menu.json`)).json();
      return { ...data, key, folder: `restaurants/${key}/`, logoPath: data.logo ? `restaurants/${key}/${data.logo}` : null };
    } catch (err) { console.error(`Failed to load ${key}:`, err); return null; }
  }));
  list.forEach((r) => { if (r) restaurants[r.key] = r; });
}

/* ===================== STATE ===================== */
const S = {
  r: null, products: {}, cart: [], step: 0, phase: 'select', input: '', paid: 0, last: null,
  err: false, drawer: false, tab: 'main', orderNo: 1, printed: false, sound: true, given: 0, msg: '', voids: 0, speak: false, dwait: false, bye: false, cust: 1, byeCust: 1
};
const MAXV = 2;            // voids allowed per order
let uidN = 0, busyUntil = 0, drawerT = null, byeT = null;
const busy = () => Date.now() < busyUntil;
const $ = (id) => document.getElementById(id);
const yen = (n) => '¥' + Number(n || 0).toLocaleString('en-US');
const total = () => S.cart.reduce((a, it) => a + it.price, 0);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ===================== SCALE STAGE ===================== */
let scale = 1, STW = 1560, STH = 700;
function fit() {
  const vw = window.innerWidth, vh = window.innerHeight;
  scale = Math.min(vw / 1560, vh / 700);
  STW = Math.max(1560, Math.round(vw / scale)); STH = Math.max(700, Math.round(vh / scale));
  const st = $('stage');
  st.style.width = STW + 'px'; st.style.height = STH + 'px';
  st.style.transform = `scale(${scale})`;
  st.style.setProperty('--dx', (STW - 1560) + 'px'); st.style.setProperty('--dy', (STH - 700) + 'px');
  const menuInner = (530 + STW - 1560) - 22 - 28 - 14;       // room for the food cards
  st.style.setProperty('--cols', Math.max(3, Math.min(6, Math.round(menuInner / 170))));
}
window.addEventListener('resize', fit);
function toggleFS() {
  const d = document.documentElement;
  if (document.fullscreenElement) document.exitFullscreen(); else if (d.requestFullscreen) d.requestFullscreen().catch(() => {});
}
if (!document.fullscreenEnabled) document.addEventListener('DOMContentLoaded', () => { const b = document.getElementById('fsBtn'); if (b) b.style.display = 'none'; });
document.addEventListener('touchstart', () => {}, { passive: true }); // enables :active on iOS

/* ===================== SOUND ===================== */
let ac = null;
function actx() {
  if (!S.sound) return null;
  try {
    if (!ac) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; ac = new A(); }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  } catch (e) { return null; }
}
function tone(f, dur, type, vol, delay, fEnd) {
  const a = actx(); if (!a) return;
  const t = a.currentTime + (delay || 0);
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
  if (fEnd) o.frequency.exponentialRampToValueAtTime(fEnd, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.1, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, freq, vol, delay, q) {
  const a = actx(); if (!a) return;
  const t = a.currentTime + (delay || 0);
  const len = Math.max(1, Math.floor(a.sampleRate * dur));
  const b = a.createBuffer(1, len, a.sampleRate); const d = b.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const s = a.createBufferSource(); s.buffer = b;
  const f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q || 1.2;
  const g = a.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(a.destination); s.start(t);
}
const sClick = () => { tone(1500, 0.03, 'square', 0.035); noise(0.025, 2600, 0.08); };
const sBeep = () => tone(1975, 0.13, 'sine', 0.13);
const sError = () => { tone(196, 0.16, 'square', 0.06); tone(147, 0.24, 'square', 0.06, 0.17); };
const sPrintTick = () => noise(0.035, 3200, 0.1);
const sKaching = () => {
  noise(0.28, 480, 0.3);
  tone(2637, 1.1, 'sine', 0.12, 0.1); tone(3951, 0.9, 'sine', 0.06, 0.1);
  tone(3136, 1.3, 'sine', 0.1, 0.22); tone(5274, 0.7, 'sine', 0.035, 0.22);
};
const sThunk = () => { tone(150, 0.16, 'sine', 0.3, 0, 60); noise(0.09, 320, 0.22); };
const sRip = () => { for (let i = 0; i < 9; i++) noise(0.04 + Math.random() * 0.03, 1400 + Math.random() * 2400, 0.22, i * 0.022 + Math.random() * 0.01, 0.8); };
const sStretch = () => noise(0.05, 900, 0.05);

function toggleSound() { S.sound = !S.sound; drawSoundBtn(); if (S.sound) sClick(); }
function drawSoundBtn() {
  const on = S.sound;
  $('soundBtn').setAttribute('aria-label', on ? 'Turn sound off' : 'Turn sound on');
  $('soundBtn').innerHTML = on
    ? '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>'
    : '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
}

/* ===================== PICKER ===================== */
function renderPicker() {
  const street = $('street');
  street.innerHTML = '';
  Object.values(restaurants).forEach((r) => {
    const b = document.createElement('button');
    b.className = 'storefront';
    b.style.setProperty('--c1', r.theme.primary);
    b.style.setProperty('--c2', r.theme.secondary);
    b.innerHTML = `
      <div class="awning"></div>
      <div class="shopfront">
        ${r.logoPath ? `<img src="${r.logoPath}" width="130" height="130" alt="">` : `<div class="emoji">${r.icon || '🍽️'}</div>`}
        <h2>${esc(r.name)}</h2>
        <p>${esc(r.description || '')}</p>
      </div>`;
    b.onclick = () => openRestaurant(r.key);
    street.appendChild(b);
  });
}

const COUNTER = { horizon: ['#d2a064', '#b9824a'], kirbycafe: ['#f8d3df', '#e3a9bd'], pokemon: ['#e2ae5c', '#c28a3a'], Rilakkuma: ['#c99a62', '#a87a45'] };
function mixHex(a, b, t) {
  const p = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const x = p(a), y = p(b);
  return '#' + x.map((v, i) => Math.round(v * (1 - t) + y[i] * t).toString(16).padStart(2, '0')).join('');
}
function openRestaurant(key) {
  const r = restaurants[key];
  S.r = r;
  S.products = {};
  ['set', 'main', 'dessert', 'drink'].forEach((c) => {
    S.products[c] = (r.categories[c] || []).map((it) => ({
      ...it,
      image: it.image ? r.folder + it.image : null,
      items: it.items ? it.items.map((x) => ({ ...x, image: x.image ? r.folder + x.image : null })) : undefined
    }));
  });
  const root = document.documentElement.style;
  root.setProperty('--wall', r.theme.primary);
  root.setProperty('--accent', r.theme.secondary);
  root.setProperty('--panel', r.theme.productsPanel || '#fff7e3');
  root.setProperty('--acc', r.theme.secondary);
  root.setProperty('--acc-d', mixHex(r.theme.secondary, '#000000', .38));
  root.setProperty('--acc-l', mixHex(r.theme.secondary, '#ffffff', .35));
  const ctr = COUNTER[r.key] || ['#cf9a5e', '#b78049'];
  root.setProperty('--ctr', ctr[0]); root.setProperty('--ctr-d', ctr[1]);
  $('wall').style.backgroundImage = `linear-gradient(transparent 70%, rgba(40,20,0,.28)), url(${r.folder}scene.webp)`;
  $('cashAv').src = `assets/av/cash_${r.key}.webp`;
  ['signLogo', 'menuLogo'].forEach((id) => {
    const el = $(id);
    if (r.logoPath) { el.src = r.logoPath; el.style.display = ''; } else { el.style.display = 'none'; }
  });
  $('signName').textContent = r.name;
  document.title = r.name;
  setTimeout(fitSign, 0);
  $('picker').style.display = 'none';
  $('app').classList.add('on');
  fit();
  resetOrder(true);
}

function backToPicker() {
  closeModal('menuModal'); closeModal('setModal'); clearTimeout(drawerT); clearTimeout(byeT); S.bye = false; stopSpeak();
  $('app').classList.remove('on');
  $('picker').style.display = 'flex';
  document.title = 'Restaurant';
}

function fitSign() {
  const el = $('signName');
  let fs = 36; el.style.fontSize = fs + 'px';
  while (el.scrollWidth > 420 && fs > 20) { fs -= 2; el.style.fontSize = fs + 'px'; }
}
$('signName').addEventListener('input', () => { document.title = $('signName').textContent; fitSign(); });
$('signName').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } });

/* ===================== ORDER FLOW ===================== */
function resetOrder(fresh, greetDelay) {
  S.cart = []; S.step = 0; S.phase = 'select'; S.input = ''; S.paid = 0; S.last = null;
  S.err = false; S.tab = 'main'; S.printed = false; S.given = 0; S.msg = ''; S.voids = 0;
  clearTimeout(drawerT); S.dwait = false; S.byeCust = S.cust; S.cust = 1 + Math.floor(Math.random() * 6);
  if (S.drawer) { S.drawer = false; }
  $('drawer').classList.remove('open');
  if (fresh) { printQueue.length = 0; newPaper(); }
  renderMenu(); updateUI();
}

function pick(item, sourceImg) {
  if (busy()) return;
  if (S.phase !== 'select' || S.step >= 3) { sError(); return; }
  busyUntil = Date.now() + 650;
  sBeep();
  if (sourceImg) flyToPrinter(sourceImg);
  if (!S.printed) printHeader();
  const entry = { ...item, uid: ++uidN };
  S.cart.push(entry);
  S.last = entry;
  S.step = item.items ? 3 : S.step + 1;
  if (S.step < 3) S.tab = CATS[S.step];
  queueLines([['item', item.name, yen(item.price)]].concat(
    item.items ? item.items.filter(Boolean).map((x) => ['sub', '+ ' + x.name, '']) : []
  ), entry.uid);
  renderMenu(); updateUI();
}
function later(fn, ms) { setTimeout(() => { if ($('app').classList.contains('on')) fn(); }, ms); }

function keyNum(k) {
  sClick();
  if (S.phase !== 'pay') { nudgeHint(); return; }
  let v = S.input + k;
  if (v.length > 6) return;
  v = String(parseInt(v, 10) || 0);
  if (parseInt(v, 10) > 1000) { v = '1000'; flashHint('The most is ¥1,000.', 1800); }
  S.input = v === '0' ? '' : v;
  S.err = false; updateUI();
}
function key1000() {
  sClick();
  if (S.phase !== 'pay') { nudgeHint(); return; }
  S.input = '1000'; S.err = false; updateUI();
}
function keyClear() { sClick(); if (S.phase === 'pay') { S.input = ''; S.err = false; updateUI(); } }
function keyVoid() {
  sClick();
  if (S.phase !== 'select' || !S.cart.length) { nudgeHint(); return; }
  if (busy()) return;
  if (S.voids >= MAXV) { sError(); flashHint('No more voids! Tear off the receipt.', 3200); return; }
  busyUntil = Date.now() + 650;
  S.voids++;
  const it = S.cart.pop();
  S.step = S.cart.length ? S.step - (it.items ? 3 : 1) : 0;
  if (S.step < 0) S.step = 0;
  S.tab = CATS[Math.min(S.step, 2)];
  S.last = S.cart[S.cart.length - 1] || null;
  retract(it.uid);                      // the line rolls back into the printer: the receipt never grows
  renderMenu(); updateUI();
}
function keyTotal() {
  sClick();
  if (S.phase !== 'select') return;
  if (!S.cart.length) { sError(); nudgeHint(); return; }
  S.phase = 'pay'; S.input = '';
  queueLines([['rule', '', ''], ['big', 'TOTAL', yen(total())]]);
  renderMenu(); updateUI();
}
function keyCash() {
  if (S.phase !== 'pay') { sClick(); nudgeHint(); return; }
  const paid = parseInt(S.input || '0', 10);
  if (paid < total()) {
    sError(); S.err = true; updateUI();
    setTimeout(() => { S.err = false; updateUI(); }, 900);
    return;
  }
  sClick();
  S.paid = paid; S.phase = 'done'; S.drawer = false; S.dwait = true; S.given = 0;
  queueLines([
    ['item', 'CASH', yen(paid)],
    ['big', 'CHANGE', yen(paid - total())],
    ['rule', '', ''],
    ['thanks', 'Thank you!', ''],

    ['blank', '', '']
  ]);
  renderMenu(); updateUI();
  // the cashier says the change first (instantly), THEN the drawer pops out
  clearTimeout(drawerT); drawerT = setTimeout(openDrawer, 1100);
}
function openDrawer() {
  if (!S.dwait || S.phase !== 'done') return;
  S.dwait = false; S.drawer = true;
  $('drawer').classList.add('open');
  sKaching(); updateUI();
}
const nextDen = () => { const left = owed() - S.given; const d = DEN.find((x) => x.v <= left); return d ? d.v : 0; };
const owed = () => (S.phase === 'done' ? S.paid - total() : 0);
function flashHint(t, ms) {
  S.msg = t; updateUI(); nudgeHint();
  clearTimeout(flashHint.t);
  flashHint.t = setTimeout(() => { S.msg = ''; updateUI(); }, ms || 2200);
}
function closeDrawer() {
  if (!S.drawer) return;
  if (S.given < owed()) { sError(); flashHint('Give the change first! Click coins.'); return; }
  sThunk(); S.drawer = false; $('drawer').classList.remove('open'); updateUI();
}
const sClink = (v) => { const f = v >= 500 ? 3400 : v >= 100 ? 3000 : v >= 10 ? 2500 : 3700; tone(f, 0.22, 'sine', 0.1); tone(f * 1.5, 0.16, 'sine', 0.04, 0.02); noise(0.03, 5000, 0.05); };
const sNote = () => { noise(0.14, 2200, 0.12, 0, 0.5); };
function giveMoney(d, comp) {
  if (!S.drawer || S.phase !== 'done') return;
  const nd = nextDen();
  if (d.v !== nd) {
    sError(); comp.classList.remove('nope'); void comp.offsetWidth; comp.classList.add('nope');
    flashHint(d.v > nd ? "Too big! Use the biggest coin that fits." : "Start with a bigger coin!", 2600);
    return;
  }
  S.given += d.v;
  if (d.kind === 'bill') sNote(); else sClink(d.v);
  flyMoney(comp.firstElementChild);
  if (S.given === owed()) setTimeout(() => { tone(1318, 0.18, 'sine', 0.1); tone(1760, 0.3, 'sine', 0.1, 0.12); }, 380);
  S.msg = ''; updateUI();
}
function flyMoney(el) {
  const p = stagePoint(el.getBoundingClientRect());
  const f = el.cloneNode(true);
  f.className = el.className + ' fly';
  Object.assign(f.style, { left: p.x + 'px', top: p.y + 'px', margin: 0, transition: 'none', zIndex: 70 });
  $('stage').appendChild(f);
  const cb = document.querySelector('#talk .tb.cust .tav') || $('talk');
  const ct = stagePoint(cb.getBoundingClientRect());
  const tx = ct.x + ct.w / 2 - (p.x + p.w / 2), ty = ct.y + ct.h / 2 - (p.y + p.h / 2);
  const a = f.animate([
    { transform: 'translate(0,0) scale(1) rotate(0deg)', opacity: 1, offset: 0 },
    { transform: `translate(${tx * 0.45}px, ${ty * 0.45 - 120}px) scale(1.25) rotate(200deg)`, opacity: 1, offset: 0.5 },
    { transform: `translate(${tx}px, ${ty}px) scale(.55) rotate(380deg)`, opacity: 0, offset: 1 }
  ], { duration: 760, easing: 'cubic-bezier(.3,.1,.5,1)', fill: 'forwards' });
  a.onfinish = () => f.remove();
  setTimeout(() => {
    const b = document.querySelector('#talk .tb.cust .tav');
    if (b) b.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.08)' }, { transform: 'scale(1)' }], { duration: 220 });
  }, 700);
}
function nudgeHint() {
  const h = $('hintPlate');
  h.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-5px)' }, { transform: 'translateX(5px)' }, { transform: 'translateX(0)' }], { duration: 260 });
}

/* ===================== MENU STAND ===================== */
function renderMenu() {
  const tabs = $('tabs');
  tabs.innerHTML = '';
  const selecting = S.phase === 'select' && S.step < 3;
  ['set'].concat(CATS).forEach((c, idx) => {
    const i = idx - 1;
    const b = document.createElement('button');
    b.className = 'tab';
    let enabled;
    if (c === 'set') enabled = selecting && S.step === 0;
    else {
      const done = S.step > i;
      const now = selecting && S.step === i;
      if (done) b.classList.add('done');
      if (now) b.classList.add('now');
      enabled = now;
      if (done) b.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
    }
    if (selecting && S.tab === c) b.classList.add('active');
    b.insertAdjacentHTML('beforeend', `<span>${CAT_LABEL[c]}</span>`);
    b.disabled = !enabled;
    b.onclick = () => { sClick(); S.tab = c; renderMenu(); };
    tabs.appendChild(b);
  });

  const grid = $('grid');
  grid.innerHTML = '';
  grid.scrollTop = 0;
  if (!selecting) {
    const title = S.phase === 'done' ? 'Paid!' : 'Order complete';
    const sub = S.phase === 'select' ? 'Press TOTAL on the register' : S.phase === 'pay' ? 'Waiting for the money…' : 'Give the change and tear off the receipt';
    grid.innerHTML = `<div class="done-panel"><div class="tick"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><div class="big">${title}</div><div class="small">${sub}</div></div>`;
    return;
  }
  if (S.tab === 'set') {
    const nb = document.createElement('button');
    nb.className = 'card newset';
    nb.innerHTML = `<img class="pic" src="restaurants/new.png" alt=""><span class="nm">Create New Set</span>`;
    nb.onclick = () => { sClick(); openSetModal(); };
    grid.appendChild(nb);
  }
  const list = S.products[S.tab] || [];
  list.forEach((it) => grid.appendChild(makeCard(it, true)));
  if (S.tab !== 'set' && !list.length) grid.insertAdjacentHTML('beforeend', '<div class="empty-note">Nothing here yet</div>');
}

function makeCard(it, clickable) {
  const b = document.createElement(clickable ? 'button' : 'div');
  b.className = 'card';
  const pics = it.items
    ? `<span class="sets">${it.items.filter(Boolean).map((x) => `<img src="${x.image}" alt="">`).join('')}</span>`
    : `<img class="pic" src="${it.image}" alt="">`;
  const nl = it.name.length > 22 ? 'l2' : it.name.length > 14 ? 'l1' : '';
  b.innerHTML = `${pics}<span class="nm ${nl}">${esc(it.name)}</span><span class="pr">${yen(it.price)}</span>`;
  if (clickable) b.onclick = () => pick(it, b.querySelector('img'));
  return b;
}

function stagePoint(rect) {
  const s = $('stage').getBoundingClientRect();
  return { x: (rect.left - s.left) / scale, y: (rect.top - s.top) / scale, w: rect.width / scale, h: rect.height / scale };
}
function flyToPrinter(img) {
  const p = stagePoint(img.getBoundingClientRect());
  const f = img.cloneNode();
  f.className = 'fly';
  Object.assign(f.style, { left: p.x + 'px', top: p.y + 'px', width: p.w + 'px', height: p.h + 'px', objectFit: 'contain' });
  $('stage').appendChild(f);
  const pt = stagePoint($('prTop').getBoundingClientRect());
  const tx = pt.x + pt.w / 2 - (p.x + p.w / 2), ty = pt.y - (p.y + p.h / 2);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    f.style.transform = `translate(${tx}px, ${ty}px) scale(.25) rotate(20deg)`;
    f.style.opacity = '0';
  }));
  setTimeout(() => f.remove(), 650);
}

/* ===================== REGISTER UI ===================== */
function updateUI() {
  const tot = total();
  const change = S.phase === 'done' ? S.paid - tot : 0;
  const selecting = S.phase === 'select';

  let l1 = 'WELCOME!', l1r = '', l2label = 'SUBTOTAL', l2 = yen(tot);
  if (selecting && S.last) { l1 = S.last.name.toUpperCase(); l1r = yen(S.last.price); }
  if (S.phase === 'pay') { l1 = 'TOTAL'; l1r = yen(tot); l2label = 'CASH'; l2 = yen(S.input || 0); }
  if (S.phase === 'done') { l1 = 'CASH'; l1r = yen(S.paid); l2label = 'CHANGE'; l2 = yen(change); }
  if (S.err) { l1 = 'NOT ENOUGH'; l1r = yen(tot); }
  if (l1.length > 22) l1 = l1.slice(0, 21) + '…';
  $('v1').textContent = l1; $('v1').classList.toggle('long', l1.length > 13);
  $('v1r').textContent = l1r; $('v2label').textContent = l2label; $('v2').textContent = l2;
  const v = $('vfd'); v.classList.remove('err'); if (S.err) { void v.offsetWidth; v.classList.add('err'); }

  // conversation + hint
  const C = (t) => ['cash', t], U = (t) => ['cust', t];
  const byeNow = S.bye && S.phase === 'select' && !S.cart.length;
  if (!byeNow) S.bye = false;
  let talk, hint, pill = 'TAP', focus = '';
  if (selecting && S.step === 0) { talk = [C('What would you like?'), U("I'd like ..., please.")]; }
  else if (selecting && S.step === 1) { talk = [C('And for dessert?'), U("I'd like ..., please.")]; }
  else if (selecting && S.step === 2) { talk = [C('And to drink?'), U("I'd like ..., please.")]; }
  else if (selecting) { talk = [U('How much is it?')]; }
  else if (S.phase === 'pay') { talk = [C(tot + ' yen, please.'), U('Here you are.')]; }
  else { talk = [C(change > 0 ? 'Your change is ' + change + ' yen.' : "That's perfect! No change."), U('Thank you!')]; }
  if (byeNow) talk = [U('Thank you!'), C("You're welcome! Have a nice day.")];
  if (byeNow) { pill = 'WAVE'; hint = 'Bye bye! Next customer…'; }
  else if (selecting && S.step < 3) { pill = 'TAP'; focus = 'menu'; hint = S.tab === 'set' ? 'a set the customer asked for' : 'the ' + ({ main: 'main dish', dessert: 'dessert', drink: 'drink' })[CATS[S.step]] + ' the customer asked for'; }
  else if (selecting) { pill = 'PRESS'; focus = 'total'; hint = 'the blue TOTAL key'; }
  else if (S.phase === 'pay') {
    if (S.err) { pill = 'OOPS'; hint = 'Not enough money! Ask for more.'; }
    else if (S.input) { pill = 'PRESS'; focus = 'cash'; hint = 'the green CASH key'; }
    else { pill = 'TYPE'; focus = 'keypad'; hint = 'the money (numbers or ¥1,000)'; }
  } else if (S.dwait) { pill = 'LISTEN'; hint = 'to the change… the drawer is opening!'; }
  else if (S.drawer && S.given < change) { pill = 'CLICK'; focus = 'coins'; const nd = nextDen(); hint = 'the ' + (nd >= 1000 ? '¥' + nd.toLocaleString('en-US') + ' bill' : '¥' + nd + ' coin') + ' (biggest first!)'; }
  else if (S.drawer) { pill = 'CLOSE'; focus = 'close'; hint = change ? 'Right! Push the drawer shut' : 'No change! Push the drawer shut'; }
  else { pill = 'TEAR'; focus = 'paper'; hint = 'the receipt: pull it up and off!'; }
  const PILL = { WAVE: '#17894d', LISTEN: '#8a3fc7', TAP: '#2f6fdb', PRESS: '#2f6fdb', TYPE: '#8a3fc7', CLICK: '#d98a00', CLOSE: '#17894d', TEAR: '#d93a3f', OOPS: '#d93a3f' };
  $('hintPill').textContent = S.msg ? 'OOPS' : pill;
  $('hintPill').style.background = PILL[S.msg ? 'OOPS' : pill];
  const stg = $('stage');
  stg.className = ''; if (focus) stg.classList.add('focus-' + focus);
  const key = JSON.stringify([talk, S.cust, S.byeCust, byeNow]);
  if ($('talk').dataset.k !== key) {
    $('talk').dataset.k = key;
    const cav = `assets/av/c${byeNow ? S.byeCust : S.cust}.webp`;
    const hear = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>';
    const bub = ([who, t]) => {
      const text = esc(t).replace(/___/g, '<span class="blank"></span>');
      const av = who === 'cash' ? `<img class="tav" src="${$('cashAv').src}" alt="">` : `<img class="tav" src="${cav}" alt="">`;
      const b = `<button class="tbub${t.length > 26 ? ' long' : ''}" onclick="speakLine(this.dataset.t)" data-t="${esc(t)}" aria-label="Listen"><span class="tt">${text}</span><span class="hear">${hear}</span></button>`;
      return `<div class="tb ${who}">${who === 'cash' ? av + b : b + av}</div>`;
    };
    $('talk').classList.toggle('cfirst', byeNow);
    $('talk').innerHTML = talk.map(bub).join('');
    if (S.speak) { const c = talk.find((x) => x[0] === 'cash'); if (c) speakLine(c[1]); }
  }
  $('hint').textContent = S.msg || hint;

  // glowing next key
  $('kTotal').classList.toggle('glow', selecting && S.step >= 3);
  $('kCash').classList.toggle('glow', S.phase === 'pay' && !!S.input && !S.err);

  // drawer
  const live = S.drawer && S.phase === 'done' && S.given < change;
  const ndv = live ? nextDen() : 0;
  DEN.forEach((d) => { $('comp' + d.v).classList.toggle('live', live); $('comp' + d.v).classList.toggle('target', live && d.v === ndv); });
  const ready = S.drawer && S.given >= change;
  $('drawerLbl').textContent = !S.drawer ? 'CASH DRAWER' : (change > 0 && S.given < change ? 'CHANGE GIVEN  ' + yen(S.given) : 'PUSH TO CLOSE');
  document.querySelector('.dfront').classList.toggle('ready', ready);

  // tear prompt
  $('tearTag').classList.toggle('on', (S.phase === 'done' && !S.drawer) || (S.phase === 'select' && S.voids >= MAXV));
  $('kVoid').classList.toggle('locked', !(S.phase === 'select' && S.cart.length) || S.voids >= MAXV);
  const paper = $('paper');
  if (paper) paper.classList.toggle('wiggle', S.phase === 'done' && !dragging);
}

function buildDrawer() {
  DEN.forEach((d) => {
    const c = document.createElement('button');
    c.className = 'comp'; c.id = 'comp' + d.v; c.type = 'button';
    c.setAttribute('aria-label', 'Give ' + yen(d.v));
    c.innerHTML = d.kind === 'bill' ? `<div class="note ${d.cls}">${d.label}</div>` : `<div class="coin ${d.cls}">${d.label}</div>`;
    c.onclick = () => giveMoney(d, c);
    $(d.kind === 'bill' ? 'trayBills' : 'trayCoins').appendChild(c);
  });
}

/* ===================== RECEIPT ===================== */
const printQueue = [];
let printing = false;

function newPaper() {
  const clip = $('paperClip');
  clip.innerHTML = '';
  const p = document.createElement('div');
  p.className = 'paper'; p.id = 'paper';
  p.innerHTML = '<div class="zig"></div><div class="paper-body" id="paperBody"></div>';
  clip.appendChild(p);
  attachTear(p);
}
function printHeader() {
  S.printed = true;
  const now = new Date(), pad = (n) => String(n).padStart(2, '0');
  const date = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  queueLines([
    ['shop', $('signName').textContent.trim() || S.r.name, ''],
    ['meta', date, 'No. ' + String(S.orderNo).padStart(4, '0')],
    ['rule', '', '']
  ]);
}
function queueLines(lines, uid) {
  lines.forEach((l) => printQueue.push(l.concat([uid || ''])));
  if (!printing) runPrinter();
}
function runPrinter() {
  if (!printQueue.length) { printing = false; return; }
  printing = true;
  const [cls, left, right, uid] = printQueue.shift();
  const body = $('paperBody');
  if (body) {
    const d = document.createElement('div');
    d.className = 'pline ' + cls;
    if (uid) d.dataset.uid = uid;
    d.innerHTML = `<span>${esc(left)}</span><span>${esc(right)}</span>`;
    body.appendChild(d);
    sPrintTick(); setTimeout(sPrintTick, 45);
  }
  setTimeout(runPrinter, 110);
}
// VOID: the item's lines roll back into the printer, so receipts can't be made longer by spamming
function retract(uid) {
  for (let i = printQueue.length - 1; i >= 0; i--) if (printQueue[i][3] === uid) printQueue.splice(i, 1);
  const body = $('paperBody');
  if (body) body.querySelectorAll('[data-uid="' + uid + '"]').forEach((el) => {
    el.style.animation = 'retract .3s ease forwards';
    setTimeout(() => el.remove(), 300);
  });
  sPrintTick(); setTimeout(sPrintTick, 70); setTimeout(sPrintTick, 140);
}

/* ---- tear off by dragging ---- */
let dragging = false;
function attachTear(p) {
  let sx = 0, sy = 0, id = null, lastStretch = 0;
  p.addEventListener('pointerdown', (e) => {
    if (!$('paperBody').children.length) return;
    dragging = true; id = e.pointerId; sx = e.clientX; sy = e.clientY;
    p.setPointerCapture(id);
    p.classList.remove('snap', 'wiggle'); p.classList.add('grab');
    $('paperClip').classList.add('free');
    actx();
  });
  p.addEventListener('pointermove', (e) => {
    if (!dragging || e.pointerId !== id) return;
    const dx = (e.clientX - sx) / scale, dy = (e.clientY - sy) / scale;
    const dist = Math.hypot(dx, dy);
    const rot = Math.max(-18, Math.min(18, dx * 0.12));
    const lift = Math.min(0, dy) * 0.12;
    p.style.transform = `translate(${dx * 0.08}px, ${lift}px) rotate(${rot}deg) scaleY(${1 + Math.min(dist, 140) * 0.0004})`;
    if (Date.now() - lastStretch > 90 && dist > 20) { sStretch(); lastStretch = Date.now(); }
    if (dist > 130) {
      dragging = false; try { p.releasePointerCapture(id); } catch (err) {}
      if (S.phase === 'done' && S.given < owed()) {
        p.classList.remove('grab'); p.classList.add('snap'); p.style.transform = '';
        setTimeout(() => $('paperClip').classList.remove('free'), 320);
        sError(); flashHint('Give the change first! Click coins.');
        return;
      }
      tearOff(p, dx, dy, rot);
    }
  });
  const end = () => {
    if (!dragging) return;
    dragging = false;
    p.classList.remove('grab'); p.classList.add('snap');
    p.style.transform = '';
    setTimeout(() => $('paperClip').classList.remove('free'), 320);
    updateUI();
  };
  p.addEventListener('pointerup', end);
  p.addEventListener('pointercancel', end);
}

function tearOff(p, dx, dy, rot) {
  sRip();
  const r = stagePoint(p.getBoundingClientRect());
  const piece = p.cloneNode(true);
  piece.removeAttribute('id');
  piece.querySelectorAll('[id]').forEach((n) => n.removeAttribute('id'));
  piece.className = 'paper flypaper';
  const pr = stagePoint($('paperClip').getBoundingClientRect());
  const h = p.offsetHeight;
  Object.assign(piece.style, { left: (pr.x + (pr.w - 228) / 2) + 'px', top: (pr.y + pr.h - h) + 'px', width: '228px', transform: `rotate(${rot}deg)`, transition: 'none' });
  $('stage').appendChild(piece);
  const len = Math.hypot(dx, dy) || 1;
  const ux = dx / len, uy = dy / len;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    piece.style.transition = 'transform .8s cubic-bezier(.2,.7,.4,1), opacity .45s ease-in .45s';
    piece.style.transform = `translate(${ux * 200}px, ${uy * 200 - 60}px) rotate(${rot * 2 + (ux >= 0 ? 14 : -14)}deg)`;
    piece.style.opacity = '0';
  }));
  setTimeout(() => piece.remove(), 1000);

  // the order on that receipt is finished (or cancelled)
  const hadOrder = S.printed;
  printQueue.length = 0;
  $('paperClip').classList.remove('free');
  newPaper();
  if (S.drawer) { sThunk(); }
  if (hadOrder) S.orderNo++;
  const wasDone = S.phase === 'done';
  resetOrder(false);
  if (wasDone) {            // thank-you exchange happens AFTER the receipt is torn off
    S.bye = true; updateUI();
    clearTimeout(byeT); byeT = setTimeout(() => { S.bye = false; updateUI(); }, 4200);
  }
}

/* ===================== MENU MODE (customer menu) ===================== */
const MENU_DECO = { horizon: ['🌊', '⚓', '🐟'], kirbycafe: ['⭐', '💖', '🍰'], pokemon: ['⚡', '🔥', '💧'], Rilakkuma: ['🐻', '🍯', '🌸'] };
const SEC_ICON = { set: '🎁', main: '🍽️', dessert: '🍰', drink: '🥤' };
const SEC_NAME = { set: 'Sets', main: 'Main Dishes', dessert: 'Desserts', drink: 'Drinks' };
function openMenuMode() {
  sClick();
  drawMenuPaper();
  $('menuModal').classList.add('on');
  $('menuPaper').scrollTop = 0;
}
function drawMenuPaper() {
  const r = S.r, d = MENU_DECO[r.key] || ['⭐', '🍽️', '✨'];
  const p = $('menuPaper');
  p.style.setProperty('--p', r.theme.primary); p.style.setProperty('--s', r.theme.secondary); p.style.setProperty('--bg', r.theme.productsPanel || '#fff7e3');
  let h = `<header class="mp-head"><span class="mp-d l">${d[0]}</span>${r.logoPath ? `<img class="mp-logo" src="${r.logoPath}" alt="">` : ''}<div class="mp-ttl"><h1>${esc(r.name)}</h1>${r.description ? `<p>${esc(r.description)}</p>` : ''}</div><span class="mp-d r">${d[1]}</span></header>`;
  h += `<div class="mp-say">Say: <b>“I’d like ___, please.”</b></div>`;
  ['set'].concat(CATS).forEach((c) => {
    const list = S.products[c] || [];
    if (!list.length) return;
    h += `<section class="mp-sec"><h2 class="mp-rib"><span>${SEC_ICON[c]}</span>${SEC_NAME[c]}<span>${d[2]}</span></h2><div class="mp-grid">`;
    list.forEach((it, i) => {
      const pics = it.items ? `<div class="mp-sets">${it.items.filter(Boolean).map((x) => `<img src="${x.image}" alt="">`).join('')}</div>` : `<div class="mp-pic"><img src="${it.image}" alt=""></div>`;
      const nl = it.name.length > 18 ? ' sm' : '';
      h += `<div class="mp-item t${i % 3}">${pics}<div class="mp-name${nl}">${esc(it.name)}</div><div class="mp-price">${yen(it.price)}</div></div>`;
    });
    h += `</div></section>`;
  });
  h += `<footer class="mp-foot">${d[0]} ${d[2]} ${d[1]} Thank you! ${d[1]} ${d[2]} ${d[0]}</footer>`;
  p.innerHTML = h;
}
function printMenu() { sClick(); try { window.print(); } catch (e) {} }
function openQR() { sClick(); $('qrModal').classList.add('on'); }
function closeModal(id) { $(id).classList.remove('on'); }

/* ===================== CREATE NEW SET ===================== */
let setSel = {}, setStep = 'main';
function openSetModal() {
  setSel = { main: null, dessert: null, drink: null }; setStep = 'main';
  drawSetModal(); $('setModal').classList.add('on');
}
function drawSetModal() {
  const order = ['main', 'dessert', 'drink', 'name'];
  $('setSteps').innerHTML = order.map((s) => {
    const done = order.indexOf(s) < order.indexOf(setStep);
    const now = s === setStep;
    const label = s === 'name' ? 'Name' : CAT_LABEL[s];
    return `<div class="tab ${done ? 'done' : ''} ${now ? 'now' : ''}">${done ? '✓ ' : ''}${label}</div>`;
  }).join('');
  const body = $('setBody');
  if (setStep !== 'name') {
    $('setTitle').textContent = { main: 'Choose a main dish', dessert: 'Choose a dessert', drink: 'Choose a drink' }[setStep];
    body.innerHTML = '<div class="mgrid pick" id="setGrid"></div>';
    (S.products[setStep] || []).forEach((it) => {
      const c = makeCard(it, true);
      c.onclick = () => { sBeep(); setSel[setStep] = it; setStep = order[order.indexOf(setStep) + 1]; drawSetModal(); };
      $('setGrid').appendChild(c);
    });
    return;
  }
  const sumP = setSel.main.price + setSel.dessert.price + setSel.drink.price;
  const price = Math.floor(sumP * 0.9);
  $('setTitle').textContent = 'Name your set';
  body.innerHTML = `
    <div class="namerow">
      <div class="preview">${[setSel.main, setSel.dessert, setSel.drink].map((x) => `<img src="${x.image}" alt="">`).join('')}</div>
      <div class="setprice"><s>${yen(sumP)}</s> → <b>${yen(price)}</b> (10% off)</div>
      <input id="setName" maxlength="30" placeholder="Set name" autocomplete="off">
      <button class="bigbtn" id="setCreate" disabled>Add set to the menu</button>
    </div>`;
  const inp = $('setName'), btn = $('setCreate');
  inp.oninput = () => { btn.disabled = !inp.value.trim(); };
  inp.onkeydown = (e) => { if (e.key === 'Enter' && inp.value.trim()) btn.click(); };
  btn.onclick = () => {
    S.products.set.push({ id: 'set' + Date.now(), name: inp.value.trim(), price, items: [setSel.main, setSel.dessert, setSel.drink] });
    sBeep(); closeModal('setModal');
    S.tab = 'set'; renderMenu(); updateUI();
  };
  setTimeout(() => inp.focus(), 50);
}

/* ===================== VOICE (optional read-aloud) ===================== */
try { S.speak = localStorage.getItem('crVoice') === '1'; } catch (e) { S.speak = false; }
function stopSpeak() { try { speechSynthesis.cancel(); } catch (e) {} }
function speakLine(t) {
  try {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(t).replace(/___|\.\.\./g, ' ... '));
    u.lang = 'en-US'; u.rate = 0.85; speechSynthesis.speak(u);
  } catch (e) {}
}
function drawSpeakBtn() {
  const on = S.speak, b = $('speakBtn');
  b.classList.toggle('off', !on);
  b.setAttribute('aria-pressed', String(on));
  b.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/>' + (on ? '<path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/>' : '<path d="M17 9l5 6M22 9l-5 6"/>') + '</svg>' + (on ? 'Voice on' : 'Voice off');
}
function toggleSpeak() {
  S.speak = !S.speak;
  try { localStorage.setItem('crVoice', S.speak ? '1' : '0'); } catch (e) {}
  drawSpeakBtn(); sClick();
  if (S.speak) { const c = document.querySelector('#talk .tb.cash .tbub'); if (c) speakLine(c.dataset.t); } else stopSpeak();
}
function ringBell() {
  tone(2637, 0.9, 'sine', 0.12); tone(3951, 0.6, 'sine', 0.05, 0.01);
  const b = $('bell'); b.animate([{ transform: 'rotate(0)' }, { transform: 'rotate(-12deg)' }, { transform: 'rotate(10deg)' }, { transform: 'rotate(-5deg)' }, { transform: 'rotate(0)' }], { duration: 500 });
}
